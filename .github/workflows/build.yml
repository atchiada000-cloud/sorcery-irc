name: Build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Sorcery-windows.zip
          - os: macos-latest
            artifact: Sorcery-macos.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-qt.txt pyinstaller pillow

      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name Sorcery
          --icon sorcery_irc/assets/icon.png
          --add-data "sorcery_irc/assets:sorcery_irc/assets"
          --collect-data certifi
          --osx-bundle-identifier com.kenobi.sorcery
          packaging/sorcery.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist/Sorcery/Sorcery.exe -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Sorcery.app/Contents/MacOS/Sorcery --smoke

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Sorcery -DestinationPath ${{ matrix.artifact }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Sorcery.app ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
